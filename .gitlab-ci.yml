pages:
  image: python
  script:
    - cd /tmp/
    - wget https://github.com/getzola/zola/releases/download/v0.12.2/zola-v0.12.2-x86_64-unknown-linux-gnu.tar.gz -O zola.tgz
    - tar zxvf zola.tgz
    - git clone https://github.com/getzola/book.git themes/book/
    - ./zola build
  artifacts:
    paths:
      - public
  only:
  - master
